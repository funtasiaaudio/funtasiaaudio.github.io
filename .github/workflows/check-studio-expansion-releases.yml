name: Studio expansion official release integrity

on:
  push:
    branches: [main, feature/zh-cn-studio-subpages-20261123]
    paths:
      - 'studio/official/expansions/**'
      - 'scripts/check-studio-expansion-release-metadata.mjs'
      - 'scripts/check-studio-expansion-downloads.sh'
      - 'scripts/audit-studio-expansion-license-sources.sh'
      - 'docs/studio-expansion-release-pins.json'
      - '.github/workflows/check-studio-expansion-releases.yml'
  pull_request:
    branches: [main, feature/zh-cn-studio-20261123]
    paths:
      - 'studio/official/expansions/**'
      - 'scripts/check-studio-expansion-release-metadata.mjs'
      - 'scripts/check-studio-expansion-downloads.sh'
      - 'scripts/audit-studio-expansion-license-sources.sh'
      - 'docs/studio-expansion-release-pins.json'
      - '.github/workflows/check-studio-expansion-releases.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all five ZIP links and source license links in EN/JA/zh-CN
        run: node scripts/check-studio-expansion-release-metadata.mjs
      - name: Verify five official Release assets with GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-studio-expansion-release-metadata.mjs --remote
      - name: Fetch four small or medium ZIPs and verify bytes, SHA-256 and ZIP CRC
        run: bash scripts/check-studio-expansion-downloads.sh
      - name: Extract and inspect official license texts (no archive execution)
        run: bash scripts/audit-studio-expansion-license-sources.sh
      - name: Preserve original license texts and exact-source summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-expansion-license-evidence-${{ github.run_id }}
          path: artifacts/studio-expansion-license/
          retention-days: 14
          if-no-files-found: warn
