name: Simplified Chinese Studio browser QA

on:
  push:
    branches: [feature/zh-cn-studio-subpages-20261123]
    paths:
      - 'studio/**'
      - 'scripts/check-zh-cn-browser.mjs'
      - '.github/workflows/check-zh-cn-browser.yml'
  pull_request:
    branches: [feature/zh-cn-studio-20261123]
    paths:
      - 'studio/**'
      - 'scripts/check-zh-cn-browser.mjs'
      - '.github/workflows/check-zh-cn-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-studio-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Chromium for test runner only
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check actual desktop and mobile browser rendering
        run: node scripts/check-zh-cn-browser.mjs
      - name: Preserve desktop/mobile screenshots and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh-cn-studio-chromium-${{ github.run_id }}
          path: artifacts/zh-cn-browser/
          retention-days: 14
          if-no-files-found: warn
