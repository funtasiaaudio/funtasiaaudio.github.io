name: Simplified Chinese Firefox and WebKit QA

on:
  push:
    branches: [feature/zh-cn-firefox-webkit-qa-20261123]
    paths:
      - 'studio/**'
      - 'catalog/**'
      - 'records/**'
      - 'utilities/**'
      - 'goods/**'
      - 'about/**'
      - 'quality/**'
      - 'support/**'
      - 'index.html'
      - 'home-i18n.js'
      - 'site-sections-i18n.js'
      - 'scripts/check-zh-cn-cross-browser.mjs'
      - '.github/workflows/check-zh-cn-cross-browser.yml'
  pull_request:
    branches: [feature/zh-cn-studio-subpages-20261123]
    paths:
      - 'studio/**'
      - 'catalog/**'
      - 'records/**'
      - 'utilities/**'
      - 'goods/**'
      - 'about/**'
      - 'quality/**'
      - 'support/**'
      - 'index.html'
      - 'home-i18n.js'
      - 'site-sections-i18n.js'
      - 'scripts/check-zh-cn-cross-browser.mjs'
      - '.github/workflows/check-zh-cn-cross-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Chinese site review branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Firefox and WebKit
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps firefox webkit
      - name: Test two browser engines, 12 pages and two CSS viewport widths
        run: node scripts/check-zh-cn-cross-browser.mjs
      - name: Preserve browser compatibility report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh-cn-cross-browser-${{ github.run_id }}
          path: artifacts/zh-cn-cross-browser/
          retention-days: 14
          if-no-files-found: warn
