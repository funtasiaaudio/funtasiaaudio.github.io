name: Simplified Chinese site checks

on:
  push:
    branches: ['feature/zh-cn-audio-localization-20261122', 'feature/zh-cn-studio-20261123', 'feature/zh-cn-studio-subpages-20261123']
  pull_request:
    branches: [main, feature/zh-cn-audio-localization-20261122, feature/zh-cn-studio-20261123]
    paths:
      - 'studio/**'
      - 'records/**'
      - 'utilities/**'
      - 'goods/**'
      - 'site-sections-i18n.js'
      - 'catalog/**'
      - 'quality/**'
      - 'about/**'
      - 'support/**'
      - 'home-i18n.js'
      - 'index.html'
      - 'sitemap.xml'
      - 'scripts/check-zh-cn.mjs'
      - 'scripts/check-zh-cn-studio-subpages.mjs'
      - 'scripts/check-zh-cn-links.mjs'
      - 'scripts/check-zh-cn-seo.mjs'
      - 'scripts/check-zh-cn-analytics.mjs'
      - 'scripts/check-zh-cn-monofilter-release.mjs'
      - 'scripts/check-zh-cn-expansion-runtime.mjs'
      - '.github/workflows/check-zh-cn.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-zh-cn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Simplified Chinese pages and links
        run: |
          node scripts/check-zh-cn.mjs
          node scripts/check-zh-cn-studio-subpages.mjs
          node scripts/check-zh-cn-links.mjs
          node scripts/check-zh-cn-seo.mjs
          node scripts/check-zh-cn-monofilter-release.mjs
          node scripts/check-zh-cn-analytics.mjs
          node scripts/check-zh-cn-expansion-runtime.mjs
