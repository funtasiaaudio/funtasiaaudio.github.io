name: Temporary note RSS article discovery
on:
  push:
    branches:
      - research/note-rss-links-20261113
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch public note article metadata (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          urls = [
              'https://note.com/hueliang_/rss',
              'https://note.com/hueliang_/m/m5293a44d69e4/rss',
              'https://note.com/yucila_funtasia/rss',
          ]
          for url in urls:
              print('RSS_SOURCE', url, flush=True)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; FUNtasia-Audio-LinkCheck/1.0)'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      content = response.read()
                      print('RSS_HTTP', response.status, len(content), flush=True)
                  root = ET.fromstring(content)
                  for item in root.findall('.//item'):
                      title = (item.findtext('title') or '').replace('\n',' ')
                      link = item.findtext('link') or ''
                      print('RSS_ITEM', json.dumps({'title':title,'url':link}, ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('RSS_ERROR', type(exc).__name__, str(exc), flush=True)
          for page in range(1,7):
              url='https://note.com/api/v2/creators/hueliang_/contents?kind=note&page='+str(page)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://note.com/hueliang_'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data=json.load(response)
                  body=data.get('data',{})
                  if isinstance(body,dict): 
                      items=body.get('contents',[])
                      last=body.get('isLastPage',False)
                  elif isinstance(body,list):
                      items=body
                      last=False
                  else: items=[];last=False
                  print('API_PAGE',page,'COUNT',len(items),'LAST',last,flush=True)
                  for item in items:
                      if not isinstance(item,dict): continue
                      title=item.get('name') or item.get('title') or ''
                      link=item.get('noteUrl') or item.get('url') or ''
                      key=item.get('key') or item.get('id') or ''
                      if not link and str(key).startswith('n'): link='https://note.com/hueliang_/n/'+str(key)
                      print('API_ITEM',json.dumps({'title':title,'url':link,'key':key},ensure_ascii=False),flush=True)
                  if last or not items: break
              except Exception as exc:
                  print('API_ERROR',type(exc).__name__,str(exc),flush=True)
                  break
          PY
