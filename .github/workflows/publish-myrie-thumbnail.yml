name: Publish Myrie Harpsichord official thumbnail

on:
  push:
    paths:
      - .github/workflows/publish-myrie-thumbnail.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Fetch official v1.0.0 release archive
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            --output /tmp/myrie-official.zip \
            "https://github.com/funtasiaaudio/myrie-harpsichord/releases/download/v1.0.0/Myrie.Harpsichord.1.0.0.zip"

      - name: Extract original PNG and switch all six catalog languages
        run: |
          python3 - <<'PY'
          import pathlib
          import struct
          import zipfile

          root = pathlib.Path(".")
          with zipfile.ZipFile("/tmp/myrie-official.zip") as archive:
              matches = [name for name in archive.namelist()
                         if name.endswith("/Artwork/thumbnail.png")
                         or name == "Artwork/thumbnail.png"]
              if len(matches) != 1:
                  raise RuntimeError(f"Expected exactly one official thumbnail; found {len(matches)}")
              artwork = archive.read(matches[0])

          if artwork[:8] != b"\x89PNG\r\n\x1a\n":
              raise RuntimeError("Official thumbnail is not a PNG")
          width, height = struct.unpack(">II", artwork[16:24])
          if (width, height) != (600, 600):
              raise RuntimeError(f"Unexpected thumbnail dimensions: {width} x {height}")

          dest = root / "catalog/assets/card-myrie-harpsichord-v1.0.0.png"
          dest.write_bytes(artwork)
          old = "card-myrie-harpsichord-v1.0.0.svg"
          new = "card-myrie-harpsichord-v1.0.0.png"
          for lang in ("ja", "en", "de", "fr", "ru", "zh-cn"):
              page = root / "catalog" / lang / "index.html"
              html = page.read_text(encoding="utf-8")
              if html.count(old) != 1:
                  raise RuntimeError(f"Unexpected Myrie image reference count in {page}")
              page.write_text(html.replace(old, new), encoding="utf-8")
          print("Original official 600 x 600 PNG extracted; all six catalogs updated.")
          PY

      - name: Publish image and website references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/assets/card-myrie-harpsichord-v1.0.0.png \
            catalog/ja/index.html catalog/en/index.html \
            catalog/de/index.html catalog/fr/index.html \
            catalog/ru/index.html catalog/zh-cn/index.html
          if git diff --cached --quiet; then
            echo "Already up to date."
          else
            git commit -m "Replace Myrie catalog placeholder with official thumbnail"
            git push
          fi
