<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow"><meta name="theme-color" content="#101a19">
<title>FUNtasia Studio — 公式特設サイトへ</title>
<meta name="description" content="FUNtasia Studioの言語別公式特設サイトへご案内します。">
<link rel="canonical" href="https://funtasiaaudio.github.io/studio/official/">
<script>
(function () {
  var supported = ['ja', 'en', 'de', 'fr', 'ru'];
  var explicit = new URLSearchParams(location.search).get('lang');
  var saved = null;
  try { saved = localStorage.getItem('funtasia.home.language'); } catch (e) {}
  var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
  var browser = 'en';
  for (var i = 0; i < prefs.length; i++) {
    var lang = String(prefs[i]).toLowerCase().split(/[-_]/)[0];
    if (supported.indexOf(lang) !== -1) { browser = lang; break; }
  }
  var locale = supported.indexOf(explicit) !== -1 ? explicit : (supported.indexOf(saved) !== -1 ? saved : browser);
  var target = 'official/' + (locale === 'ja' || locale === 'ru' ? locale + '/' : '');
  location.replace(target + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=official/ja/"></noscript>
